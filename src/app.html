<title>Toute la Natation Arabe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,600&family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: a financial weekly's special issue. Blue masthead, ruled running heads, heavy black headlines,
   italic serif kickers, a yellow key-figure box, blue data bubbles and athlete "fiches" laid out like company pages.
   Deliberately a single printed-paper look (light), all colours set explicitly. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#111417; --muted:#5B6670; --rule:#1A1A1A; --hair:#D9DCDF; --panel:#ECEBE7;
  --navy:#003254; --blue:#00569C; --cyan:#00A8DA; --bubble:#B7CDE0; --yellow:#FFE500;
  --up:#1E9A4A; --down:#D21F2B; --tun:#D21F2B; --egy:#00A8DA; --alg:#1E9A4A;
  --gold:#C9A227; --silver:#9AA5AD; --bronze:#A8673A;
  --f-head:"Archivo","Noto Kufi Arabic",Arial Narrow,sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Archivo","IBM Plex Sans Arabic",Arial,sans-serif;
}
[dir="rtl"]{--f-head:"Noto Kufi Arabic","Archivo",sans-serif;--f-body:"IBM Plex Sans Arabic","Archivo",sans-serif;--f-serif:"Noto Kufi Arabic",Georgia,serif}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-stretch:92%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;color:var(--ink)}
.num,td.t{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* masthead */
.mast{background:var(--blue);color:#fff}
.mast .wrap{display:flex;align-items:stretch;gap:20px;padding-block:clamp(14px,1.8vw,22px);flex-wrap:wrap}
header .wrap{max-width:1440px}
.logo{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:80%;font-size:clamp(2.3rem,4.4vw,4rem);line-height:.9;letter-spacing:-.02em}
.logo small{display:block;font:italic 600 clamp(1rem,1.3vw,1.2rem) var(--f-serif);letter-spacing:0;text-transform:none;margin-top:6px;opacity:.9}
[dir="rtl"] .logo{font-family:"Noto Kufi Arabic",sans-serif;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.2}
.mast .brand{display:flex;align-items:center;gap:clamp(10px,2vw,18px);min-width:0}.logo-mark{height:clamp(64px,9vw,130px);width:auto;flex:none;display:block}
.mast .spacer{flex:1}@media (max-width:1240px){.mast .special{display:none}}
.mast .flash{background:var(--yellow);color:var(--ink);padding:10px 16px;display:flex;flex-direction:column;justify-content:center;min-width:160px}
.mast .flash b{font:900 clamp(2.2rem,3vw,2.6rem)/1 "Archivo",sans-serif;font-stretch:80%}
.mast .flash span{font-size:clamp(.78rem,1vw,.9rem);font-weight:600}
.mast .special{align-self:end;font:italic 600 1.05rem var(--f-serif);border:2px solid #fff;padding:4px 10px;white-space:nowrap}
.issue{border-bottom:1px solid var(--rule)}
.issue .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap;font-size:.82rem}
.issue .meta{color:var(--muted)}
nav.sections{display:flex;gap:2px;flex-wrap:wrap}
nav.sections a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;padding:4px 8px}
nav.sections a:hover{background:var(--yellow)}
[dir="rtl"] nav.sections a{letter-spacing:0;text-transform:none}
.lang{display:flex;border:1px solid var(--rule)}
.lang button{border:0;background:var(--paper);color:var(--ink);padding:5px 12px;font:700 .82rem var(--f-body);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* running head */
.runhead{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:22px}
.runhead .pg{font:italic 400 1.7rem var(--f-serif)}
.runhead .sl{font:italic 400 1.7rem var(--f-serif);color:var(--muted)}
.runhead .ttl{font:italic 400 1.5rem var(--f-serif);text-transform:uppercase;letter-spacing:.02em}
.runhead .rmeta{margin-inline-start:4px;padding-inline-start:14px;border-inline-start:1px solid var(--hair);font-size:.74rem;color:var(--muted);white-space:nowrap}
[dir="rtl"] .runhead .ttl,[dir="rtl"] .runhead .pg{font-style:normal;font-size:1.25rem}
section.page{padding-block:34px 26px}

.kicker{font:italic 600 1rem var(--f-serif);text-transform:uppercase;color:var(--ink);letter-spacing:.02em}
[dir="rtl"] .kicker{font-style:normal;font-size:.9rem}
.lbl{font:800 .8rem var(--f-head);text-transform:uppercase;color:var(--navy);letter-spacing:.02em}
[dir="rtl"] .lbl{text-transform:none;letter-spacing:0}
.big{font-weight:900;font-stretch:78%;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.02;letter-spacing:-.015em}
[dir="rtl"] .big{font-stretch:100%;font-weight:900;line-height:1.35;font-size:clamp(1.7rem,4vw,2.8rem)}
.big em{font-family:var(--f-serif);font-weight:600;font-style:italic;font-stretch:100%}
h2.big{font-size:clamp(1.8rem,3.8vw,2.7rem)}
.standfirst{font-size:1.12rem;color:#2C3740;max-width:70ch;margin:10px 0 0;font-weight:400}
.drop::first-letter{float:inline-start;font:900 3.6rem/0.85 "Archivo",sans-serif;font-stretch:80%;margin-inline-end:8px;margin-top:4px}
[dir="rtl"] .drop::first-letter{float:none;font:inherit;margin:0}

/* front page */
.front{display:grid;grid-template-columns:1fr 300px;gap:28px;padding-block:28px 20px}
.front .cols{columns:2;column-gap:24px;margin-top:18px;font-size:.93rem;text-align:justify;hyphens:auto}
.front .cols p{margin:0 0 10px}
.chiffre{background:var(--yellow);padding:12px 14px 14px}
.chiffre .lbl{color:var(--ink)}
.chiffre .n{font:italic 400 5.2rem/1 var(--f-serif);letter-spacing:-.02em}
.chiffre p{margin:4px 0 0;font-size:.86rem}
.bubbles{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.bub{width:78px;height:78px;border-radius:50%;background:var(--bubble);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
.bub b{font:900 1.35rem "Archivo",sans-serif;font-stretch:80%;color:var(--navy)}
.bub span{font-size:.62rem;font-weight:600;color:var(--navy);padding-inline:6px}
.bub.y{background:var(--yellow)}
.side-box{border-top:3px solid var(--rule);padding-top:8px;margin-top:16px}

/* variations table */
.vt{width:100%;border-collapse:collapse;font-size:.86rem}
.vt th{font:800 .76rem var(--f-head);text-align:start;padding:6px 8px;border-bottom:2px solid var(--rule);color:var(--ink)}
.vt td{padding:6px 8px;border-bottom:1px solid var(--hair)}
.chg,.tm,td.t{direction:ltr;unicode-bidi:isolate}
.chg{display:inline-block;min-width:64px;text-align:center;color:#fff;font-weight:700;font-size:.8rem;padding:2px 6px;font-variant-numeric:tabular-nums}
.chg.up{background:var(--up)} .chg.down{background:var(--down)} .chg.mid{background:var(--blue)} .chg.rk{background:var(--navy)}

/* fiches */
.fiche{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;border-top:3px solid var(--rule);padding-block:16px 26px}
.fiche + .fiche{margin-top:6px}
.fiche .txt{columns:2;column-gap:22px;font-size:.9rem;margin-top:12px}
.fiche .txt h4{font:800 .76rem var(--f-head);text-transform:uppercase;margin:0 0 2px;break-after:avoid}
[dir="rtl"] .fiche .txt h4{text-transform:none}
.fiche .txt p{margin:0 0 12px}
.conseil{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--rule);padding-top:8px;margin-top:4px;break-inside:avoid}
.conseil .ic{width:22px;height:22px;border-radius:50%;flex:none;margin-top:2px;border:4px solid currentColor;background:#fff}
.conseil b{text-transform:uppercase;font-size:.82rem}
.conseil.medal{color:var(--up)} .conseil.final{color:var(--blue)} .conseil.semi{color:#7A5AA6} .conseil.heats{color:var(--muted)}
.conseil .w{color:var(--ink);font-size:.86rem}
.figs .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair)}
.figs .ev{font-size:.84rem;font-weight:600}
.figs .ev small{display:block;color:var(--muted);font-weight:400;font-size:.74rem}
.figs .tm{font:900 1.25rem "Archivo",sans-serif;font-stretch:80%;color:var(--navy);background:var(--bubble);border-radius:999px;padding:4px 12px}

/* days */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:3px solid var(--rule);margin-top:10px}
.day{padding:10px 10px 12px;border-inline-end:1px solid var(--hair);min-width:0}
.day:last-child{border-inline-end:0}
.day h3{font:italic 600 1.05rem var(--f-serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:6px}
[dir="rtl"] .day h3{font-style:normal;font-size:.9rem}
.day ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:.82rem}
.day li b{font-weight:800}
.day li span.e{display:block;color:var(--muted);font-size:.76rem}

/* tags */
.nat{display:inline-block;font:800 .68rem "Archivo",sans-serif;padding:1px 5px;background:var(--navy);color:#fff;letter-spacing:.04em;vertical-align:1px}
.nat.TUN{background:var(--tun)}
.tier{font-size:.72rem;font-weight:800;padding:2px 7px;text-transform:uppercase;white-space:nowrap;color:#fff}
[dir="rtl"] .tier{text-transform:none}
.tier.medal{background:var(--up)} .tier.final{background:var(--blue)} .tier.semi{background:#7A5AA6} .tier.heats{background:#8B969E}
.pill{font-size:.7rem;font-weight:800;padding:1px 6px;border:1px solid var(--navy);color:var(--navy);white-space:nowrap}
.pill.sc{border-color:var(--down);color:var(--down)}
.medal{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.medal i{width:12px;height:12px;border-radius:50%;display:inline-block}
.m-G i{background:var(--gold)} .m-S i{background:var(--silver)} .m-B i{background:var(--bronze)} .m-X i{border:2px dashed var(--muted)}
.m-X{color:var(--muted);text-decoration:line-through}

/* controls + tables */
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:28px 0 10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{font:inherit;font-size:.86rem;padding:6px 9px;border:1px solid var(--rule);border-radius:0;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg button{border:0;background:#fff;color:var(--ink);padding:6px 12px;font:700 .82rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tbl{overflow-x:auto;border-top:3px solid var(--rule)}
table.data{border-collapse:collapse;width:100%;font-size:.84rem;min-width:760px}
table.data th{font:800 .72rem var(--f-head);text-transform:uppercase;text-align:start;color:#fff;background:var(--navy);padding:6px 9px;position:sticky;top:0}
[dir="rtl"] table.data th{text-transform:none}
table.data td{padding:6px 9px;border-bottom:1px solid var(--hair);text-align:start;vertical-align:top}
table.data tbody tr:nth-child(even) td{background:#F6F7F8}
table.data td.t{white-space:nowrap;font-weight:600}
td.dd{white-space:nowrap}



.pie-wrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center;margin:6px 0 18px}
#pie svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.pie-leg{list-style:none;margin:8px 0 0;padding:0;columns:3;column-gap:18px;font-size:.84rem}
.pie-leg li{break-inside:avoid;display:grid;grid-template-columns:12px 1fr auto auto;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid var(--hair);cursor:pointer}
.pie-leg li:hover,.pie-leg li.on{background:var(--yellow)}
.mleg{columns:1!important;max-width:560px}
.mleg li{grid-template-columns:12px 1fr auto auto auto auto auto!important}
.mleg .g{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
.pie-leg i{width:12px;height:12px;display:block}
.pie-leg .c{font-weight:800;font-variant-numeric:tabular-nums}
.pie-leg .pc{color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:end}
@media (max-width:900px){.pie-wrap{grid-template-columns:1fr}.pie-leg{columns:2}}
@media (max-width:480px){.pie-leg{columns:1}}
/* la cote */
.cote-head{display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--down);padding-bottom:4px}
.cote-head .lc{font:400 clamp(2.4rem,6vw,3.8rem)/1 var(--f-serif);color:var(--down);letter-spacing:.01em}
[dir="rtl"] .cote-head .lc{font-family:"Noto Kufi Arabic",serif;font-weight:900}
.cote-head .sub{font:italic 400 1.2rem var(--f-serif);color:var(--down)}
.cote-sum{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:16px 0 6px}
.cote-empty{background:var(--panel);padding:18px;font-size:.95rem;margin-top:14px}
.cote-empty b{display:block;font:800 1rem var(--f-head);margin-bottom:4px}
.cote-days{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:14px}
.cote-day h3{font:italic 600 1.15rem var(--f-serif);color:var(--down);border-bottom:1px solid var(--down);padding-bottom:3px;margin-bottom:4px}
[dir="rtl"] .cote-day h3{font-style:normal;font-size:1rem}
table.cote{width:100%;border-collapse:collapse;font-size:.82rem}
table.cote td{padding:4px 6px;border-bottom:1px solid var(--hair)}
table.cote td.r{text-align:end;font-weight:800;white-space:nowrap}
table.cote tr.hl td{background:#FFF7B8}
.ph{font-size:.7rem;color:var(--muted);text-transform:uppercase}
@media (max-width:760px){.cote-days{grid-template-columns:1fr}.cote-sum{grid-template-columns:1fr}}
/* palmarès */
.pal{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px}
.tally{width:100%;border-collapse:collapse;font-size:.9rem}
.tally th{font:800 .74rem var(--f-head);border-bottom:2px solid var(--rule);padding:6px;text-align:start}
.tally td{padding:6px;border-bottom:1px solid var(--hair)}
.tally td.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tally tr.tot td{border-top:2px solid var(--rule);font-weight:900}
#chart-svg svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;vertical-align:-1px}
.encadre{border:3px solid var(--yellow);padding:12px 14px;margin-top:18px;font-size:.9rem}
.encadre .lbl{color:var(--ink);display:block;margin-bottom:4px}

/* nations */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;grid-auto-rows:1fr}
.ncard{border-top:1px solid var(--rule);padding:10px 0 14px;min-width:0}
.ncard.has{border-top:3px solid var(--rule)}
.ncard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ncard h3{font-weight:900;font-stretch:85%;font-size:1.15rem}
.ncard .bubbles{gap:6px;margin-top:6px}
.ncard .bub{width:46px;height:46px}
.ncard .bub b{font-size:1rem}
.ncard .bub span{font-size:.52rem}

/* legends */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;row-gap:6px}
.lcard{border-top:3px solid var(--rule);padding:10px 0 16px;min-width:0}
.lcard h3{font-weight:900;font-stretch:82%;font-size:1.4rem;line-height:1.1}
.lcard .meta{font:italic 400 .95rem var(--f-serif);color:var(--muted);margin-top:2px}
[dir="rtl"] .lcard .meta{font-style:normal;font-size:.85rem}
.lcard .rec{display:inline-block;background:var(--yellow);font-weight:800;font-size:.78rem;padding:2px 7px;margin:8px 0 6px}
.lcard p{margin:0;font-size:.9rem;text-align:justify;hyphens:auto}

.src{columns:2;column-gap:28px;font-size:.84rem;padding-inline-start:18px}
.src li{margin-bottom:6px;break-inside:avoid}
footer{background:var(--navy);color:#fff;margin-top:30px}
footer .wrap{padding-block:22px 30px;font-size:.82rem;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .logo{font-size:1.8rem}
.note{font-size:.84rem;color:var(--muted);margin-top:12px;max-width:95ch}

@media (max-width:980px){.front,.pal,.fiche{grid-template-columns:1fr}.lgrid{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(3,1fr)}.day:nth-child(3){border-inline-end:0}.day:nth-child(n+4){border-top:1px solid var(--hair)}}
@media (max-width:600px){.front .cols,.fiche .txt{columns:1}.lgrid{grid-template-columns:1fr}.days{grid-template-columns:1fr 1fr}.day{border-inline-end:0!important;border-top:1px solid var(--hair)}.src{columns:1}.runhead .rmeta{display:none}.mast .special{display:none}.chiffre .n{font-size:4rem}}
@media (prefers-reduced-motion:no-preference){nav.sections a{transition:background .12s}}
.pbd{color:var(--muted);font-size:.78em;white-space:nowrap}
.wmap{margin:30px 0 8px;border-top:3px solid var(--ink,#111417);padding-top:10px}
#wmap svg{width:100%;height:auto;display:block;margin-top:8px;direction:ltr}
#wmap .city{cursor:pointer}
#wmap .city:hover circle.hit{stroke:#003254;stroke-width:2}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wchips button,.citychip{font:600 .8rem Archivo,'Noto Kufi Arabic',sans-serif;border:1px solid #C9D0D6;background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:#111417}
.wchips button[aria-pressed="true"],.citychip{background:#003254;color:#fff;border-color:#003254}
.wchips button.off{opacity:.4}
.wchips b{font-weight:800}
.rectally{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rectally span.c{font:700 .8rem Archivo,'Noto Kufi Arabic',sans-serif;border:1px solid #C9D0D6;border-radius:999px;padding:3px 10px;background:#fff}
.rectally b{font-weight:900;color:#003254}
.bjtag{display:inline-block;font:800 .66rem Archivo,'Noto Kufi Arabic',sans-serif;background:#FFD400;color:#111417;padding:1px 6px;border-radius:3px;margin-inline-start:6px;vertical-align:1px;white-space:nowrap}
.pend{color:#B3261E;font-weight:900;cursor:help}
.fab-contact{position:fixed;inset-inline-start:16px;bottom:16px;z-index:70;display:inline-flex;align-items:center;gap:8px;background:#FFE500;color:#0E1A24;border:2px solid #0E1A24;font:800 .95rem var(--f-head,system-ui);padding:11px 18px 11px 14px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}.fab-contact svg{width:20px;height:20px;flex:none}.fab-contact:hover{background:#0E1A24;color:#FFE500}[dir="rtl"] .fab-contact{padding:11px 14px 11px 18px}@media print{.fab-contact{display:none}}

  const cities=[...new Set(MEDALS.map(m=>m[2]))];
  const col={G:'#C9A227',S:'#9AA5AD',B:'#A8673A'};
  const [vx,vy,vw,vh]=WMAP.vb;
  let svg=`<svg viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="${t('wmap_title')}"><path d="${WMAP.land}" fill="#DDE3E8" stroke="#fff" stroke-width=".5"/><path d="${WMAP.ar}" fill="#B9CFE0" stroke="#fff" stroke-width=".5"/>`;
  const lbl=(x,y,side,txt,sub,dim)=>`<text x="${x}" y="${y+4}" text-anchor="${side==='l'?'end':'start'}" font-size="13" font-weight="800" fill="${dim?'#8B969E':'#111417'}" font-family="Archivo,'Noto Kufi Arabic'" paint-order="stroke" stroke="#fff" stroke-width="3">${txt}${sub?`<tspan font-weight="500" fill="#5B6670"> ${sub}</tspan>`:''}</text>`;
  // Beijing 2026
  {const [x,y]=WMAP.P['Pékin']; svg+=`<g><circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="#0057A0" stroke-width="2" stroke-dasharray="3 2"/><circle cx="${x}" cy="${y}" r="3" fill="#0057A0"/>${lbl(x-13,y,'l',AR()?'بكين':'Pékin','2026')}</g>`;}

    const all=MEDALS.filter(m=>m[2]===c), here=ms.filter(m=>m[2]===c), valid=here.filter(m=>m[8]!=='X');

    const years=[...new Set(all.map(m=>m[0]))].join(', ');

}
function renderNations(){
  const codes=Object.keys(NATIONS), score=c=>{const a=tallyOf(c);return a.G*1e4+a.S*100+a.B};
  codes.sort((a,b)=>score(b)-score(a)||ENTRIES.filter(e=>e[0]===b).length-ENTRIES.filter(e=>e[0]===a).length);
  document.getElementById('ngrid').innerHTML=codes.map(c=>{const a=tallyOf(c), tot=a.G+a.S+a.B, n=ENTRIES.filter(e=>e[0]===c).length;
    return `<article class="ncard ${tot?'has':''} flag f-${c}"><div class="hd"><h3>${NATIONS[c][AR()?1:0]}</h3><span class="nat ${c}">${c}</span></div>
    ${tot?`<div class="bubbles"><div class="bub g"><b>${a.G}</b><span>${t('med_G')}</span></div><div class="bub s"><b>${a.S}</b><span>${t('med_S')}</span></div><div class="bub b"><b>${a.B}</b><span>${t('med_B')}</span></div></div>`:''}
    <p>${NATINFO[c]?(AR()?NATINFO[c].ar:NATINFO[c].fr):''}</p><div class="bj">${t('at_bj')} : ${n?n+' '+t('sw_word'):t('none_bj')}</div></article>`;}).join('');
}
function renderLegends(){
  document.getElementById('lgrid').innerHTML=LEGENDS.map(l=>`<article class="lcard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${AR()?l.ar:l.n}</h3><span class="nat ${l.nat}">${l.nat}</span></div>
   <div class="meta">${AR()?l.n:l.ar}${l.born?' · '+l.born:''}</div>${l.m!=='—'?`<span class="rec">${l.m.replace('LC',t('lc')).replace('SC',t('sc'))}</span>`:'<div style="height:10px"></div>'}<p>${AR()?l.arb:l.fr}</p></article>`).join('');
}
function renderFinals(){
  document.querySelector('#t-fin thead').innerHTML=`<tr><th>${t('th_year')}</th><th>${t('th_pool')}</th><th>${t('th_sw')}</th><th>${t('th_nat')}</th><th>${t('th_ev')}</th><th>${t('th_rank')}</th><th>${t('th_time')}</th></tr>`;
  document.querySelector('#t-fin tbody').innerHTML=FINALS.map(f=>`<tr><td class="t">${dmy(f[8])}</td><td>${pool(f[1])}</td><td><b>${f[3]&&AR()?f[3]:pick(f[2])}</b></td><td>${nat(f[4])}</td><td>${/^[MW]\d/.test(f[5])?ev(f[5],AR()):pick(f[5])}</td><td class="t">${f[6]}${AR()?'':'e'}</td><td class="t">${f[7]}</td></tr>`).join('');
}
function renderSources(){document.getElementById('srclist').innerHTML=SOURCES.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('');}
function renderCote(){
  const med=RESULTS.filter(r=>['G','S','B'].includes(r[8])).length, fin=RESULTS.filter(r=>r[5]==='F'&&r[6]<=8).length, rec=RESULTS.filter(r=>['NR','AR'].includes(r[8])).length;
  document.getElementById('cote-bub').innerHTML=`<div class="bub y"><b>${med}</b><span>${t('c_med')}</span></div><div class="bub"><b>${fin}</b><span>${t('c_fin')}</span></div><div class="bub"><b>${rec}</b><span>${t('c_rec')}</span></div>`;
  document.getElementById('cote-upd').textContent=COTE_UPDATED?t('c_upd')+' : '+pick(COTE_UPDATED):t('rmeta');
  const body=document.getElementById('cote-body');
  if(!RESULTS.length){body.innerHTML=`<div class="cote-empty"><b>${t('cote_empty_t')}</b>${t('cote_empty')}</div>`;return;}
  const flag=f=>['G','S','B'].includes(f)?medal(f):f?`<span class="pill sc">${t('f_'+f)}</span>`:'';
  const days=[...new Set(RESULTS.map(r=>r[0]))].sort((a,b)=>b-a);
  body.innerHTML='<div class="cote-days">'+days.map(d=>`<div class="cote-day"><h3>${t('day_names')[d-1]}</h3><table class="cote"><tbody>${RESULTS.filter(r=>r[0]===d).map(r=>`<tr class="${r[8]?'hl':''}"><td><span class="nat ${r[2]}">${r[2]}</span> <b>${AR()?r[4]:r[3]}</b><br><span style="color:var(--muted)">${ev(r[1],AR())}</span> <span class="ph">${t('ph_'+r[5])}</span></td><td class="r">${r[6]}${AR()?'':'e'}</td><td class="r num" style="direction:ltr">${r[7]}</td><td>${flag(r[8])}</td></tr>`).join('')}</tbody></table></div>`).join('')+'</div>';
}
function renderPie(){
  const counts={}; ENTRIES.forEach(e=>counts[e[0]]=(counts[e[0]]||0)+1);
  const list=Object.entries(counts).sort((a,b)=>b[1]-a[1]||(a[0]==='TUN'?-1:b[0]==='TUN'?1:a[0].localeCompare(b[0])));
  const tot=ENTRIES.length;
  const pal=['#003254','#00569C','#00A8DA','#5B8DB8','#7FB8D9','#B7CDE0','#1E9A4A','#7A5AA6','#C9A227','#8B969E'];
  let k=0; const col={}; list.forEach(([c])=>{col[c]=c==='TUN'?'#D21F2B':pal[k++%pal.length];});
  const sel=document.getElementById('f-bj-nat').value||'all';
  const R=120,r=72,cx=150,cy=150; let a0=-Math.PI/2; let svg=`<svg viewBox="0 0 300 300" role="img" aria-label="${t('pie_title')}">`;
  list.forEach(([c,n])=>{const a1=a0+2*Math.PI*n/tot, large=a1-a0>Math.PI?1:0, off=(sel===c)?8:0, mid=(a0+a1)/2, dx=Math.cos(mid)*off, dy=Math.sin(mid)*off;
    const P=(rad,a)=>[cx+dx+rad*Math.cos(a),cy+dy+rad*Math.sin(a)];
    const [x1,y1]=P(R,a0),[x2,y2]=P(R,a1),[x3,y3]=P(r,a1),[x4,y4]=P(r,a0);
    svg+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z" fill="${col[c]}" stroke="#fff" stroke-width="1.5" data-n="${c}" style="cursor:pointer"><title>${NATIONS[c][AR()?1:0]} : ${n} (${(100*n/tot).toFixed(1)} %)</title></path>`;
    if(n>=3){const [lx,ly]=P((R+r)/2,mid); svg+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" font-weight="800" fill="${['#7FB8D9','#B7CDE0','#C9A227','#00A8DA'].includes(col[c])?'#111417':'#fff'}" font-family="Archivo" pointer-events="none">${c}</text>`;}
    a0=a1;});
  svg+=`<text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="40" font-weight="900" fill="#003254" font-family="Archivo">${tot}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="12" fill="#5B6670" font-family="Archivo,Noto Kufi Arabic">${t('pie_center')}</text></svg>`;
  document.getElementById('pie').innerHTML=svg;
  document.getElementById('pie-leg').innerHTML=list.map(([c,n])=>`<li data-n="${c}" class="${sel===c?'on':''}"><i style="background:${col[c]}"></i><span>${NATIONS[c][AR()?1:0]}</span><span class="c">${n}</span><span class="pc" style="direction:ltr">${(100*n/tot).toFixed(1).replace('.',AR()?'.':',')} %</span></li>`).join('');
  document.querySelectorAll('#pie [data-n], #pie-leg [data-n]').forEach(el=>el.onclick=()=>{const f=document.getElementById('f-bj-nat'); f.value=(f.value===el.dataset.n)?'all':el.dataset.n; renderBJ(); renderPie();});
}
function renderMedPie(){
  const cols={TUN:'#D21F2B',EGY:'#00A8DA',ALG:'#1E9A4A'};
  const list=['TUN','EGY','ALG'].map(c=>{const r=tallyOf(c,POOL==='all'?null:POOL);return [c,r,r.G+r.S+r.B];}).filter(x=>x[2]>0);
  const tot=list.reduce((a,x)=>a+x[2],0), sel=document.getElementById('f-med-nat').value||'all';
  document.getElementById('mpie-title').textContent=t('mpie_title')+(POOL==='all'?'':' · '+(POOL==='LC'?t('lc'):t('sc')));
  const R=120,r=72,cx=150,cy=150; let a0=-Math.PI/2, svg=`<svg viewBox="0 0 300 300" role="img" aria-label="${t('mpie_title')}">`;
  list.forEach(([c,m,n])=>{let a1=a0+2*Math.PI*n/tot; if(n===tot) a1-=0.0001; const large=a1-a0>Math.PI?1:0, off=sel===c?8:0, mid=(a0+a1)/2, dx=Math.cos(mid)*off, dy=Math.sin(mid)*off;
    const P=(rad,a)=>[cx+dx+rad*Math.cos(a),cy+dy+rad*Math.sin(a)];
    const [x1,y1]=P(R,a0),[x2,y2]=P(R,a1),[x3,y3]=P(r,a1),[x4,y4]=P(r,a0);
    svg+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z" fill="${cols[c]}" stroke="#fff" stroke-width="2" data-n="${c}" style="cursor:pointer"><title>${NATIONS[c][AR()?1:0]} : ${n} (${(100*n/tot).toFixed(1)} %)</title></path>`;
    const [lx,ly]=P((R+r)/2,mid); svg+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="800" fill="${c==='EGY'?'#111417':'#fff'}" font-family="Archivo" pointer-events="none">${n>=2?c:''}</text>`; a0=a1;});
  svg+=`<text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="40" font-weight="900" fill="#003254" font-family="Archivo">${tot}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="12" fill="#5B6670" font-family="Archivo,Noto Kufi Arabic">${t('mpie_center')}</text></svg>`;
  document.getElementById('mpie').innerHTML=svg;
  const dot=k=>`<span class="medal m-${k}" title="${t('med_'+k)}"><i></i></span>`;
  document.getElementById('mpie-leg').innerHTML=list.map(([c,m,n])=>`<li data-n="${c}" class="${sel===c?'on':''}"><i style="background:${cols[c]}"></i><span>${NATIONS[c][AR()?1:0]}</span><span class="g">${dot('G')} ${m.G}</span><span class="g">${dot('S')} ${m.S}</span><span class="g">${dot('B')} ${m.B}</span><span class="c">${n}</span><span class="pc" style="direction:ltr">${(100*n/tot).toFixed(1).replace('.',AR()?'.':',')} %</span></li>`).join('');
  document.querySelectorAll('#mpie [data-n], #mpie-leg [data-n]').forEach(el=>el.onclick=()=>{const f=document.getElementById('f-med-nat'); f.value=(f.value===el.dataset.n)?'all':el.dataset.n; renderMedals(); renderMedPie(); document.getElementById('t-med').scrollIntoView({behavior:'smooth',block:'start'});});
}
function renderAll(){applyStatic(); countdown(); renderCote(); renderBJ(); renderPie(); renderVT(); renderFiches(); renderDays(); renderBJ(); renderTally(); renderChart(); renderMedals(); renderMedPie(); renderNations(); renderRecords(); renderLegends(); renderFinals(); renderSources();
  document.getElementById('k-sw').textContent=ENTRIES.length; document.getElementById('k-nat').textContent=new Set(ENTRIES.map(e=>e[0])).size;}
document.getElementById('btn-fr').onclick=()=>{LANG='fr';try{localStorage.setItem('ca-lang','fr')}catch(e){};renderAll();};
document.getElementById('btn-ar').onclick=()=>{LANG='ar';try{localStorage.setItem('ca-lang','ar')}catch(e){};renderAll();};
document.getElementById('f-bj-nat').onchange=()=>{renderBJ();renderPie();};
document.getElementById('f-bj-q').oninput=renderBJ;
document.getElementById('f-med-nat').onchange=()=>{renderMedals();renderMedPie();};
document.querySelectorAll('#seg-pool button').forEach(b=>b.onclick=()=>{POOL=b.dataset.v;document.querySelectorAll('#seg-pool button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderMedals();renderMedPie();});
document.querySelectorAll('#seg-rec button').forEach(b=>b.onclick=()=>{RECPOOL=b.dataset.v;document.querySelectorAll('#seg-rec button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderRecords();});
renderAll();
</script>
